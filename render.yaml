services:
  - type: web
    name: qairo-smart-ai-study-assistant
    runtime: python
    plan: free
    buildCommand: python -m py_compile learning_engine.py local_server.py
    startCommand: python local_server.py
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
